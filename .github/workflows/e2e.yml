name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./demo.sh | tee demo.out
      - name: demo.sh shows the break and the fix
        run: |
          grep -F 'petstore_api 2.0.0 cannot be deployed to production' demo.out
          grep -F 'Pet.status' demo.out
          grep -F 'petstore_api 3.0.0 can be deployed to production' demo.out
      - name: demo.sh gives the proposed change back
        run: git diff --exit-code contracts/
      - if: failure()
        run: docker compose logs broker
