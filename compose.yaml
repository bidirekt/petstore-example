name: petstore-example

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bidirekt
      POSTGRES_PASSWORD: bidirekt
      POSTGRES_DB: bidirekt
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidirekt -d bidirekt"]
      interval: 2s
      timeout: 3s
      retries: 15

  broker:
    image: ghcr.io/bidirekt/broker:0.4.0
    environment:
      BIDIREKT_DATABASE_URL: postgres://bidirekt:bidirekt@postgres:5432/bidirekt?sslmode=disable
      BIDIREKT_PUBLIC_URL: http://localhost:8080
      BIDIREKT_TOKEN_SIGNING_KEY: cGV0c3RvcmUtZGVtby1vbmx5LXNpZ25pbmcta2V5MzI=
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/broker", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15

  setup:
    image: curlimages/curl:8.23.0
    profiles: [setup]
    network_mode: service:broker
    entrypoint: [sh, /setup.sh]
    volumes:
      - ./setup.sh:/setup.sh:ro

  cli:
    image: ghcr.io/bidirekt/cli:0.4.0
    profiles: [cli]
    working_dir: /example
    environment:
      BIDIREKT_BROKER_URL: http://broker:8080
      BIDIREKT_API_KEY:
    volumes:
      - .:/example:ro
    depends_on:
      broker:
        condition: service_healthy

volumes:
  postgres-data:
