name: petstore-example

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bidirekt
      POSTGRES_PASSWORD: bidirekt
      POSTGRES_DB: bidirekt
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidirekt -d bidirekt"]
      interval: 2s
      timeout: 3s
      retries: 15

  broker:
    image: ghcr.io/bidirekt/broker:0.1.0-rc.3
    environment:
      BIDIREKT_DATABASE_URL: postgres://bidirekt:bidirekt@postgres:5432/bidirekt?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/broker", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15

  cli:
    image: ghcr.io/bidirekt/cli:0.1.0-rc.2
    profiles: [cli]
    working_dir: /example
    environment:
      BIDIREKT_BROKER_URL: http://broker:8080
    volumes:
      - .:/example:ro
    depends_on:
      broker:
        condition: service_healthy

volumes:
  postgres-data:
