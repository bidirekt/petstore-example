name: petstore-example

services:
  postgres:
    image: postgres:17-alpine
    attach: false
    environment:
      POSTGRES_USER: bidirekt
      POSTGRES_PASSWORD: bidirekt
      POSTGRES_DB: bidirekt
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidirekt -d bidirekt"]
      interval: 2s
      timeout: 3s
      retries: 15

  broker:
    image: ghcr.io/bidirekt/broker:0.1.0-rc.3
    attach: false
    environment:
      BIDIREKT_DATABASE_URL: postgres://bidirekt:bidirekt@postgres:5432/bidirekt?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/broker", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15

  seed:
    image: ghcr.io/bidirekt/cli:0.1.0-rc.2
    entrypoint: ["sh", "/example/scripts/seed.sh"]
    working_dir: /example
    environment:
      BIDIREKT_BROKER_URL: http://broker:8080
    volumes:
      - .:/example:ro
    depends_on:
      broker:
        condition: service_healthy

  check:
    image: ghcr.io/bidirekt/cli:0.1.0-rc.2
    entrypoint: ["sh", "/example/scripts/check.sh"]
    working_dir: /example
    environment:
      BIDIREKT_BROKER_URL: http://broker:8080
    volumes:
      - .:/example:ro
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  postgres-data:
